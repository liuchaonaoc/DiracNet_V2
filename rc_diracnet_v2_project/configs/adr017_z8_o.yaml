# ADR-017 baseline (shape weight=2.0, pre-ADR-027) on hydrogenic Z=1..8 (O).
# Extends the 12-row H/He/Li set to 48 rows (8 elements × 6 n-levels).
defaults: default.yaml

kan:
  kind: mlp

stage1:
  n_epochs: 1000
  weights:
    # ADR-027 bump reverted — ADR-017 / R3 shape anchor (weight=2.0).
    shape: 2.0
  warmup:
    shape_weight_after_pretrain: 2.0
  gate:
    test_manifest: data_cache/manifest_hydrogenic_z8.parquet

dataset:
  manifest: data_cache/manifest_hydrogenic_z8.parquet

training:
  ckpt_dir: ./checkpoints/v2_adr017_z8_o
  log_dir: ./logs/v2_adr017_z8_o
